name: Release images

# Publishes the server and dashboard as ready-to-pull images to GHCR, so
# people self-hosting can skip building from source. Runs when a tag like
# v1.0.0 is pushed. Build and test both images locally first - a bad tag
# push means a bad public image until it's fixed and re-tagged.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [server, dashboard]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      # Docker image names must be lowercase, but the GitHub username here
      # (Balaji-R-05) has capitals - lowercase it before using it below.
      - id: owner
        run: echo "lower=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # linux/amd64 only for now — multi-arch is a stretch, not required.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lower }}/adaptivegate-${{ matrix.app }}:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.lower }}/adaptivegate-${{ matrix.app }}:latest
