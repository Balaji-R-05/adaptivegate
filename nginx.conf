# This file does two jobs:
# 1. The Supabase client always calls /auth/v1/..., but GoTrue (the auth
#    server) only understands plain paths like /token and /user - so we
#    strip the /auth/v1 prefix and forward the request.
# 2. GoTrue never sends CORS headers on its own, so without this the
#    dashboard's browser requests would fail with "Failed to fetch" before
#    ever reaching GoTrue.
server {
    listen 8000;

    location /auth/v1/ {
        # Only added for OPTIONS below - GoTrue's real responses already
        # set their own Access-Control-Allow-Origin, and adding a second
        # one here would make browsers reject the response.
        set $cors_origin $http_origin;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            # Echo back whatever headers the browser asked for, instead of
            # listing them by hand - that list keeps changing as the
            # Supabase client library is updated.
            add_header Access-Control-Allow-Headers $http_access_control_request_headers always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass http://auth:9999;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
