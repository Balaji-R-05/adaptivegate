# Local Postgres (pgvector) for fully offline dev. Not used by default now
# that DATABASE_URL points at the Supabase project's own Postgres (see
# .env.example) — Supabase Auth's auth.users only exists there, so the real
# dev/login loop runs against Supabase, not this container.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adaptivegate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adaptivegate}
      POSTGRES_DB: ${POSTGRES_DB:-adaptivegate}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
