services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - .env
    ports:
      - '3000:3000'

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      # No Supabase build args needed - the dashboard fetches those from
      # the server at runtime instead, see apps/dashboard/src/lib/supabase.ts.
    ports:
      - '5173:5173'

  # --- Self-hosted Supabase stack, only starts with `docker compose
  # --profile selfhosted up`. A plain `docker compose up` skips these, so
  # cloud users are unaffected. See docs/self-hosting.md.

  db:
    image: supabase/postgres:17.6.1.136
    profiles: ['selfhosted']
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '5432:5432'
    volumes:
      - selfhosted-db:/var/lib/postgresql/data
      - ./scripts/zz-selfhosted-db-init.sh:/docker-entrypoint-initdb.d/zz-selfhosted-init.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    image: supabase/gotrue:v2.197.0
    profiles: ['selfhosted']
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: ${SUPABASE_URL}

      GOTRUE_DB_DRIVER: postgres
      # supabase_auth_admin owns the auth schema in this image - the
      # postgres user doesn't have permission to run GoTrue's migrations.
      GOTRUE_DB_DATABASE_URL: postgresql://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres

      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL}
      GOTRUE_DISABLE_SIGNUP: 'false'

      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_ISSUER: ${SUPABASE_URL}

      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      # Skip email confirmation - there's no SMTP server to send it from.
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9999/health']
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    image: nginx:alpine
    profiles: ['selfhosted']
    depends_on:
      auth:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '8000:8000'

volumes:
  selfhosted-db:
