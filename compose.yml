services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adaptivegate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adaptivegate}
      POSTGRES_DB: ${POSTGRES_DB:-adaptivegate}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
