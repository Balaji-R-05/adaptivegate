# Local demo/dev convenience: `docker compose up` runs the server and
# dashboard together without needing pnpm installed on the host. This is not
# the production deployment plan (see README's Tech Stack: server on
# Render/Railway/Fly.io, dashboard on Vercel/Netlify) — just a quick way to
# spin up the whole stack to show someone. The actual database is Supabase's
# hosted Postgres (see .env.example), not a container.
services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - .env
    ports:
      - '3000:3000'

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    ports:
      - '5173:4173'
